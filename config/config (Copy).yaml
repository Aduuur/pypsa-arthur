      smooth: false
      add_cutout_windspeed: false
    resource_classes: 1
    capacity_per_sqkm: 2
    correction_factor: 0.8855
    corine: [44, 255]
    luisa: false
    natura: true
    ship_threshold: 400
    max_depth: 60
    min_shore_distance: 30000
    excluder_resolution: 200
