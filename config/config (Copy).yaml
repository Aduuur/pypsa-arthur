ee:
  non_historic_cutout:
    enable: true
    et_regression: true
  pp_cooling:
    pp_add_cooling_types: [nuclear, lignite, coal, CCGT, biomass, H2]
    climatedata_generators_t_p_max_pu: false
    climatedata_generators_t_p_max_pu_path: 'path/to/cd2es/results/europe/{model}/techfiles'
    cd2es_mapping:
      nuclear: Nuclear
      lignite: Coal
      coal: Coal
      CCGT: CCGT
      biomass: Biomass
      H2: H2

version: v2025.07.0
tutorial: false

logging:
  level: INFO
  format: "%(levelname)s:%(name)s:%(message)s"

remote:
  ssh: ""
  path: ""

run:
  prefix: ""
  name: "test-aro-minimal-heat-power"
  scenarios:
    enable: false
    file: config/scenarios.yaml
  disable_progressbar: false
  shared_resources:
    policy: false
    exclude: []
  use_shadow_directory: false

workflow:
  mode: "aro"

robust:
  cutouts:
    - cutout_mCNRM-CERFACS-CM5_rcp45_2010
    - cutout_mCNRM-CERFACS-CM5_rcp26_2010

  base_target: "networks/base.nc"
  prepared_template: "networks/prepared_{cutout}.nc"

  out_network: "networks/robust.nc"
  out_summary: "results/robust_summary.json"

  aro:
    co2_cost_mode: "off"
    ls_penalty: 100000
    convergence_tol: 0.001
    dispatch_workers: 1
    eps_ls: 0.05

    initial_cutouts:
      - cutout_mCNRM-CERFACS-CM5_rcp45_2010

    max_iter: 5

    solver_options:
      threads: 8
      method: 2
      crossover: 0
      BarConvTol: 1.0e-5
      Seed: 123
      AggFill: 0
      PreDual: 0
      NodefileStart: 0.5
      NodefileDir: "/tmp"
      MemLimit: 600
      DualReductions: 0
      NumericFocus: 1

foresight: myopic

scenario:
  clusters:
    - 24
  opts:
    - ''
  sector_opts:
    - ''
  planning_horizons:
    - 2050

countries:
  - DE
  - GB
  - FR
  - ES
  - IT
  - PL
  - CZ
  - AT
  - CH
  - BE
  - NL
  - DK
  - SE
  - PT
  - 'NO'
  - FI
  - LT
  - LV
  - EE

snapshots:
  start: "2010-01-01"
  end: "2010-12-31"
  inclusive: 'left'

enable:
  drop_leap_day: true
  retrieve_cutout: false
  build_cutout: false

co2_budget:
  2020: 0.720
  2025: 0.648
  2030: 0.450
  2035: 0.250
  2040: 0.100
  2045: 0.050
  2050: 0.000

electricity:
  voltages: [220., 300., 330., 380., 400., 500., 750.]
  base_network: osm
  osm-prebuilt-version: 0.6

  gaslimit_enable: false
  gaslimit: false
  co2limit_enable: false
  co2limit: 7.75e+7
  co2base: 1.487e+9

  operational_reserve:
    activate: false
    epsilon_load: 0.02
    epsilon_vres: 0.02
    contingency: 4000

  max_hours:
    battery: 6
    H2: 168

  extendable_carriers:
    Generator: [solar, onwind, offwind-ac, offwind-dc, OCGT, CCGT]
    StorageUnit: [battery]
    Store: []
    Link: []

  powerplants_filter: (DateOut >= 2024 or DateOut != DateOut) and not (Country == 'Germany' and Fueltype == 'Nuclear')
  custom_powerplants: false
  everywhere_powerplants: []

  conventional_carriers: [nuclear, oil, OCGT, CCGT, coal, lignite]
  renewable_carriers: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, hydro]

  estimate_renewable_capacities:
    enable: false
    from_gem: true
    year: 2020
    expansion_limit: false
    technology_mapping:
      Offshore: offwind-ac
      Onshore: onwind
      PV: solar

  autarky:
    enable: false
    by_country: false

  transmission_limit: v1.25

  costs:
    version: v0.13.3
    custom_cost_adaptions:
      enable: true
      file: data/custom_cost_adaptions_per_horizon.csv

atlite:
  default_cutout: cutout_mCNRM-CERFACS-CM5_rcp45_2010
  nprocesses: 16
  show_progress: false
  cutouts:
    cutout_mCNRM-CERFACS-CM5_rcp26_2010:
      module: cordex
      x: [-12., 42.]
      y: [33., 72.]
      dx: 0.3
      dy: 0.3
      time: ['2010', '2010']
      prepare_kwargs:
        features: ['temperature', 'runoff', 'height']

    cutout_mCNRM-CERFACS-CM5_rcp45_2010:
      module: cordex
      x: [-12., 42.]
      y: [33., 72.]
      dx: 0.3
      dy: 0.3
      time: ['2010', '2010']
      prepare_kwargs:
        features: ['temperature', 'runoff', 'height']

